<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo Project</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0A0A14; color: #E0E0F0; text-align: center; padding: 32px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background-image: linear-gradient(#1A1A2E 1px, transparent 1px),
                      linear-gradient(90deg, #1A1A2E 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .card {
    border: 1px solid #5227FF; border-radius: 12px; padding: 48px 40px;
    background: rgba(14,14,26,.9); max-width: 640px;
  }
  h1 { margin: 0 0 4px; font-size: clamp(28px, 5vw, 44px); letter-spacing: 2px; color: #5227FF; }
  p  { margin: 16px 0 0; line-height: 1.7; color: #A4A4CA; font-size: 15px; }
  code {
    background: #12121F; border: 1px solid #232338; border-radius: 4px;
    padding: 2px 6px; color: #00FFCC; font-size: 13px;
  }
  .tag { margin-top: 28px; font-size: 12px; letter-spacing: 4px; color: #6A6A88; }
</style>
</head>
<body>
  <div class="card">
    <h1>DEMO PROJECT</h1>
    <p>
      This placeholder page is embedded by the project template. Point an entry in
      <code>PROJECT_ROUTES</code> at your own file in <code>/public</code>, or at the
      full URL of a deployed site, and it will render here instead.
    </p>
    <p>Delete <code>public/projects/demo/</code> once you have your own projects.</p>
    <div class="tag">PORTFOLIO TEMPLATE</div>
  </div>
</body>
</html>
