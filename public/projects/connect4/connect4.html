  <style rel="stylesheet" crossorigin>
    @import"https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Space+Mono:wght@400;700&display=swap";

    :root {
      --bg: #0a0b0f;
      --bg-1: #111318;
      --bg-2: #181b23;
      --bg-3: #1e2230;
      --surface: rgba(255, 255, 255, .04);
      --surface-2: rgba(255, 255, 255, .07);
      --border: rgba(255, 255, 255, .08);
      --border-2: rgba(255, 255, 255, .14);
      --text-1: #f0f2f8;
      --text-2: #8b90a4;
      --text-3: #5a5f72;
      --accent: #6c8cff;
      --accent-glow: rgba(108, 140, 255, .25);
      --danger: #ff5c5c;
      --success: #4ade80;
      --warn: #fbbf24;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --font-body: "DM Sans", system-ui, sans-serif;
      --font-mono: "Space Mono", monospace;
      --transition: .15s cubic-bezier(.4, 0, .2, 1);
      --transition-spring: .4s cubic-bezier(.34, 1.56, .64, 1)
    }

    [data-theme=light] {
      --bg: #f0f2f8;
      --bg-1: #e8eaf2;
      --bg-2: #dde0ee;
      --bg-3: #d0d4e8;
      --surface: rgba(0, 0, 0, .04);
      --surface-2: rgba(0, 0, 0, .07);
      --border: rgba(0, 0, 0, .08);
      --border-2: rgba(0, 0, 0, .16);
      --text-1: #1a1d2e;
      --text-2: #4a4f6a;
      --text-3: #8085a0;
      --accent: #4a6cef;
      --accent-glow: rgba(74, 108, 239, .2)
    }

    *,
    *:before,
    *:after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    * {
      scrollbar-width: none
    }

    *::-webkit-scrollbar {
      display: none
    }

    html {
      scrollbar-gutter: stable
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-1);
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition)
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      border: none;
      background: none
    }

    input,
    select {
      border: none;
      outline: none
    }

    .app-root {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative
    }

    .bg-grain {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 128px
    }

    .app-layout {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      height: 100dvh;
      overflow: hidden
    }

    .game-area {
      width: 100%;
      max-width: 780px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: .5rem
    }

    @media (min-width: 1600px) {
      .game-area {
        max-width: 1100px
      }
    }

    @media (min-width: 2000px) {
      .game-area {
        max-width: 1400px
      }
    }

    .board-area {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: .75rem;
      align-items: stretch
    }

    .board-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: .3rem
    }

    .board-container {
      flex: 1;
      min-height: 0;
      position: relative;
      width: 100%;
      border-radius: var(--radius-lg);
      overflow: hidden
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .6rem 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-lg);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      gap: 1rem;
      min-height: 52px
    }

    .status-player {

      align-items: center;
      gap: .6rem;
      --player-color: #888
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px var(--player-color);
      transition: background-color var(--transition)
    }

    .status-text {
      font-size: .95rem;
      font-weight: 500;
      letter-spacing: -.01em
    }

    .status-sub {
      font-size: .78rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums
    }

    .status-timers {
      display: flex;
      gap: .5rem
    }

    .timer-chip {
      font-family: var(--font-mono);
      font-size: .8rem;
      padding: .2rem .55rem;
      border-radius: 20px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      letter-spacing: .04em;
      transition: all var(--transition)
    }

    .timer-chip.urgent {
      background: #ff5c5c26;
      border-color: #ff5c5c66;
      color: var(--danger);
      animation: pulse-urgent 1s ease infinite
    }

    @keyframes pulse-urgent {

      0%,
      to {
        opacity: 1
      }

      50% {
        opacity: .6
      }
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: .35rem;
      padding: .46rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-lg);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px)
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: .2rem
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border-2);
      margin: 0 .25rem
    }

    .toolbar-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      transition: all var(--transition);
      position: relative
    }

    .toolbar-btn:hover:not(.disabled) {
      background: var(--surface-2);
      color: var(--text-1)
    }

    .toolbar-btn.active {
      background: #6c8cff26;
      color: var(--accent);
      border: 1px solid rgba(108, 140, 255, .3)
    }

    .toolbar-btn.disabled {
      opacity: .3;
      cursor: not-allowed
    }

    .toolbar-btn.danger:hover:not(.disabled) {
      background: #ff5c5c26;
      color: var(--danger)
    }

    .col-numbers {
      padding: 0 2%
    }

    .col-number {
      text-align: center;
      font-family: var(--font-mono);
      font-size: .7rem;
      color: var(--text-3);
      font-weight: 700;
      transition: color var(--transition), background-color var(--transition)
    }

    .col-number.hovered {
      color: var(--bg-2);
      background-color: var(--text-2)
    }

    .disc-layer {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 1
    }

    .disc-static {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform .2s ease;
      position: relative;
      overflow: hidden
    }

    .disc-static:after {
      content: "";
      display: var(--disc-gloss, block);
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse 60% 60% at 40% 40%, rgba(255, 255, 255, .28) 0%, rgba(255, 255, 255, .1) 40%, transparent 70%);
      pointer-events: none
    }

    .disc-winning {
      animation: disc-pulse .6s ease infinite alternate
    }

    @keyframes disc-pulse {
      0% {
        filter: brightness(1)
      }

      to {
        filter: brightness(1.35) saturate(1.3)
      }
    }

    .disc-hint {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, .4);
      animation: hint-pulse .8s ease infinite
    }

    @keyframes hint-pulse {

      0%,
      to {
        opacity: .3;
        transform: scale(.9)
      }

      50% {
        opacity: 1;
        transform: scale(1)
      }
    }

    .col-target {
      height: 100%;
      cursor: pointer;
      transition: background var(--transition);
      border-radius: var(--radius-sm)
    }

    .col-target:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px
    }

    .sidebar-backdrop {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: #0000008c;
      z-index: 40;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      animation: fade-in .2s ease
    }

    @keyframes fade-in {
      0% {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .settings-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      height: 100dvh;
      width: min(380px, 92vw);
      background: var(--bg-1);
      border-left: 1px solid var(--border);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translate(100%);
      transition: transform .35s cubic-bezier(.4, 0, .2, 1);
      overflow: hidden
    }

    .settings-sidebar.open {
      transform: translate(0);
      box-shadow: -16px 0 48px #00000080
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0
    }

    .sidebar-title {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-weight: 600;
      font-size: .9rem;
      letter-spacing: .02em;
      color: var(--text-1)
    }

    .sidebar-close {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      transition: all var(--transition)
    }

    .sidebar-close:hover {
      background: var(--surface-2);
      color: var(--text-1)
    }

    .sidebar-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: .75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border-2) transparent
    }

    .settings-section {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      min-height: 0;
      flex-shrink: 0
    }

    .section-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .6rem .75rem;
      cursor: pointer;
      background: var(--surface);
      border: none;
      color: var(--text-1);
      transition: background var(--transition)
    }

    .section-header:hover {
      background: var(--surface-2)
    }

    .section-title {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin: 0
    }

    .section-chevron {
      color: var(--text-3);
      transition: transform .2s ease;
      flex-shrink: 0
    }

    .section-chevron.rotated {
      transform: rotate(180deg)
    }

    .section-body {
      border-top: 1px solid var(--border)
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5rem .75rem;
      gap: .75rem;
      border-bottom: 1px solid var(--border)
    }

    .setting-row:last-child {
      border-bottom: none
    }

    .setting-label {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .82rem;
      color: var(--text-2);
      flex-shrink: 0
    }

    .select-wrap {
      position: relative;
      display: flex;
      align-items: center
    }

    .setting-select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      padding: .3rem 1.6rem .3rem .55rem;
      font-size: .82rem;
      color: var(--text-1);
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition), color var(--transition)
    }

    .setting-select:hover,
    .setting-select:focus {
      border-color: var(--border-2)
    }

    .setting-select option {
      background: var(--bg-1);
      color: var(--text-1)
    }

    .select-chevron {
      position: absolute;
      right: .45rem;
      pointer-events: none;
      color: var(--text-3)
    }

    .setting-number {
      width: 56px;
      text-align: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .3rem .4rem;
      font-size: .82rem;
      font-family: var(--font-mono);
      color: var(--text-1);
      transition: border-color var(--transition)
    }

    .setting-number:hover,
    .setting-number:focus {
      border-color: var(--border-2)
    }

    .size-inputs {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .8rem;
      color: var(--text-3)
    }

    .difficulty-info {
      padding: .5rem .75rem .6rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: .3rem
    }

    .difficulty-level {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent)
    }

    .difficulty-desc {
      font-size: .76rem;
      color: var(--text-2);
      line-height: 1.5
    }

    .toggle {
      width: 36px;
      height: 20px;
      border-radius: 10px;
      position: relative;
      transition: background var(--transition);
      flex-shrink: 0
    }

    .toggle.on {
      background: var(--accent)
    }

    .toggle.off {
      background: var(--surface-2);
      border: 1px solid var(--border-2)
    }

    .toggle-knob {
      position: absolute;
      top: 1px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: left var(--transition);
      box-shadow: 0 1px 4px #0006
    }

    .toggle.on .toggle-knob {
      left: 18px
    }

    .toggle.off .toggle-knob {
      left: 2px
    }

    .tooltip-anchor {
      position: relative;
      display: inline-flex;
      align-items: center
    }

    .tooltip-box {
      width: 200px;
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translate(-50%);
      background: #1a1a1a;
      color: #f0f0f0;
      font-size: 11px;
      line-height: 1.4;
      padding: 5px 8px;
      border-radius: 5px;
      pointer-events: none;
      transition: opacity .15s ease;
      z-index: 10
    }

    .tooltip-anchor:hover .tooltip-box {
      visibility: visible;
      opacity: 1
    }

    .btn-group {
      display: flex;
      gap: .25rem
    }

    .btn-option {
      display: flex;
      align-items: center;
      gap: .3rem;
      padding: .28rem .6rem;
      border-radius: var(--radius-sm);
      font-size: .78rem;
      color: var(--text-2);
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all var(--transition)
    }

    .btn-option:hover {
      background: var(--surface-2);
      color: var(--text-1)
    }

    .btn-option.active {
      background: #6c8cff26;
      color: var(--accent);
      border-color: #6c8cff59
    }

    .color-swatches {
      display: flex;
      gap: .35rem
    }

    .color-swatch {
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      transition: all var(--transition);
      cursor: pointer
    }

    .color-swatch:hover,
    .color-swatch.active {
      transform: scale(1.15)
    }

    .players-list {
      display: flex;
      flex-direction: column;
      gap: 0
    }

    .player-row {
      padding: .5rem .75rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: .4rem
    }

    .player-row:last-child {
      border-bottom: none
    }

    .player-color-group {
      display: flex;
      gap: .3rem;
      flex-wrap: wrap
    }

    .mini-swatch {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all var(--transition)
    }

    .mini-swatch:hover {
      transform: scale(1.2)
    }

    .mini-swatch.active {
      border-color: #fff
    }

    .player-name-row {
      display: flex;
      align-items: center;
      gap: .5rem
    }

    .player-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .player-name-input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .25rem .5rem;
      font-size: .82rem;
      color: var(--text-1);
      transition: border-color var(--transition);
      cursor: text
    }

    .player-name-input:focus {
      border-color: var(--border-2)
    }

    .player-name-input::placeholder {
      color: var(--text-3)
    }

      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .08em;
      padding: .15rem .4rem;
      background: #6c8cff26;
      color: var(--accent);
      border: 1px solid rgba(108, 140, 255, .3);
      border-radius: 20px
    }

    .history-panel {
      width: 200px;
      flex-shrink: 0;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      max-height: 480px;
      overflow: hidden;
      transform: scaleX(0);
      transform-origin: right;
      opacity: 0;
      transition: transform .25s var(--transition), opacity .25s ease
    }

    .history-panel.open {
      transform: scaleX(1);
      opacity: 1
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5rem .7rem;
      border-bottom: 1px solid var(--border);
      font-size: .78rem;
      font-weight: 600;
      color: var(--text-2);
      flex-shrink: 0
    }

    .history-close {
      color: var(--text-3);
      padding: .2rem;
      border-radius: 4px;
      transition: all var(--transition)
    }

    .history-close:hover {
      color: var(--text-1);
      background: var(--surface-2)
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: .25rem 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent
    }

    .history-empty {
      padding: 1rem;
      text-align: center;
      font-size: .78rem;
      color: var(--text-3)
    }

    .history-item {
      display: grid;
      grid-template-columns: 22px 10px 1fr auto;
      align-items: center;
      gap: .4rem;
      padding: .3rem .7rem;
      font-size: .76rem;
      transition: background var(--transition)
    }

    .history-item:hover {
      background: var(--surface-2)
    }

    .history-num {
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: .68rem;
      text-align: right
    }

    .history-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%
    }

    .history-name {
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .history-col {
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: .68rem
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: #000000a6;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fade-in .15s ease
    }

    .modal-card {
      background: var(--bg-1);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-xl);
      padding: 2rem 2.5rem;
      text-align: center;
      min-width: min(400px, 90vw);
      max-width: 90vw;
      box-shadow: 0 24px 80px #0009;

      flex-direction: column;
      align-items: center;
      gap: 1.25rem
    }

    .winner-disc-display {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      box-shadow: 0 0 0 6px #ffffff14, 0 8px 32px #00000080;
      position: relative;
      overflow: hidden
    }

    .winner-disc-display:after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse 60% 40% at 35% 30%, rgba(255, 255, 255, .3) 0%, transparent 70%)
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -.02em;
      color: var(--text-1)
    }

    .modal-actions {
      display: flex;
      gap: .75rem;
      width: 100%
    }

    .modal-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: .4rem;
      padding: .55rem 1rem;
      border-radius: var(--radius-md);
      font-size: .875rem;
      font-weight: 500;
      transition: all var(--transition);
      cursor: pointer;
      border: 1px solid transparent
    }

    .modal-btn.primary {
      background: var(--accent);
      color: #fff
    }

    .modal-btn.primary:hover {
      background: #7d9bff;
      box-shadow: 0 4px 16px var(--accent-glow)
    }

    .modal-btn.secondary {
      background: var(--surface-2);
      color: var(--text-2);
      border-color: var(--border)
    }

    .modal-btn.secondary:hover {
      background: var(--bg-3);
      color: var(--text-1)
    }

    .ai-thinking-dot {
      display: inline-flex;
      gap: 3px;
      align-items: center
    }

    .ai-thinking-dot span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: thinking-bounce 1.2s ease infinite
    }

    .ai-thinking-dot span:nth-child(2) {
      animation-delay: .2s
    }

    .ai-thinking-dot span:nth-child(3) {
      animation-delay: .4s
    }

    @keyframes thinking-bounce {

      0%,
      80%,
      to {
        transform: translateY(0);
        opacity: .4
      }

      40% {
        transform: translateY(-4px);
        opacity: 1
      }
    }

    .restart-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .6rem 1rem;
      background: #fbbf241f;
      border-bottom: 1px solid rgba(251, 191, 36, .25);
      font-size: .78rem;
      color: var(--warn);
      flex-shrink: 0
    }

    .restart-banner-btn {
      font-size: .75rem;
      font-weight: 600;
      padding: .25rem .65rem;
      border-radius: var(--radius-sm);
      background: #fbbf2433;
      border: 1px solid rgba(251, 191, 36, .4);
      color: var(--warn);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition)
    }

    .restart-banner-btn:hover {
      background: #fbbf2459
    }

    .restart-badge {
      font-size: .65rem;
      font-weight: 700;
      color: var(--warn);
      opacity: .7;
      margin-left: 2px;
      align-self: flex-start
    }

    .restart-legend {
      font-size: .72rem;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: .3rem
    }

    .confirm-card {
      max-width: min(360px, 90vw)
    }

    .confirm-icon {
      color: var(--warn);
      display: flex;
      justify-content: center
    }

    .confirm-message {
      font-size: .95rem;
      color: var(--text-2);
      text-align: center;
      line-height: 1.5
    }

    .modal-btn.danger {
      background: #ff5c5c26;
      color: var(--danger);
      border: 1px solid rgba(255, 92, 92, .35)
    }

    .modal-btn.danger:hover {
      background: #ff5c5c47
    }

    @media (max-width: 600px) {
      .app-layout {
        padding: .5rem
      }

      .game-area {
        gap: .35rem
      }

      .history-panel {
        position: fixed;
        right: .75rem;
        top: 50%;
        transform: translateY(-50%) scaleX(0);
        max-height: 60dvh;
        z-index: 30;
        transform-origin: right
      }

      .history-panel.open {
        transform: translateY(-50%) scaleX(1)
      }

      .modal-card {
        padding: 1.5rem
      }

      .modal-btn {
        font-size: .75rem
      }

      .topbar {
        flex-direction: column;
        gap: .5rem
      }

      .status-bar {
        width: 100%;
        justify-content: center
      }

      .toolbar {
        width: 100%;
        height: 100%;
        flex-wrap: wrap;
        padding: .44rem .4rem;
        justify-content: center
      }

      .board-container {
        flex: unset;
        width: 100%;
        aspect-ratio: 1
      }

      .board-area {
        position: relative
      }
